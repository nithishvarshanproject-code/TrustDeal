# plugins.yaml lists all plugins to be loaded by the agent
# see /docs/reference-plugin-api.md for details
#
# Deal Desk: this is OmegaClaw v0.1.19's default list, unchanged, plus the `dealdesk`
# entry at the end. Mounted read-only over config/plugins.yaml by omega\start-omega.bat.

- name: irc
  loader: python
  location: "{REPO}/channels"

- name: telegram
  loader: python
  location: "{REPO}/channels"

- name: slack
  loader: python
  location: "{REPO}/channels"

- name: mattermost
  loader: python
  location: "{REPO}/channels"

- name: mockchannel
  loader: python
  location: "{REPO}/channels"

- name: wschat
  loader: python
  location: "{REPO}/channels"

- name: openaiapi
  loader: python
  location: "{REPO}/providers"

- name: asione
  loader: python
  location: "{REPO}/providers"

- name: openrouter
  loader: python
  location: "{REPO}/providers"

- name: openai
  loader: python
  location: "{REPO}/providers"

- name: mockprovider
  loader: python
  location: "{REPO}/providers"

- name: workflow
  loader: metta
  location: "{REPO}/plugins/workflow"

- name: openclaw
  loader: metta
  location: "{REPO}/plugins/openclaw"

# Deal Desk: loads engine/*.metta into the agent's space and executes Deal Desk requests
# exactly (no LLM in the decision path). Code: omega/dealdesk_plugin/dealdesk.py
- name: dealdesk
  loader: python
  location: "/PeTTa/dealdesk/plugin"
